data:
  dir: data
  train_file: train.csv
  test_file: sample_submission.csv
  id_column: img_name
  target: PSNR

# Свёрточные сети читают сами изображения из images_dir; таблица признаков им не нужна,
# но пайплайн загружает её, чтобы проверить состав изображений.
features:
  table: features/features.csv.gz
  recompute: false
  images_dir: data

validation:
  n_splits: 5
  n_bins: 10
  seed: 42

# Все сети делают прогноз по целому изображению 640×480 и считаются со смешанной точностью; обучающие
# изображения случайно отражаются. cnn_small и cnn_efficientnet_crop обучаются на случайных вырезках
# 256×256 в исходном масштабе, cnn_efficientnet — на целых изображениях. Две EfficientNet отличаются
# только вырезками (и мини-батчем, который для целых изображений уменьшен под память GPU).
models:
  cnn_small:
    type: cnn
    params:
      backbone: small
      filters: [32, 64, 128, 256]
      optimizer: adamw
      learning_rate: 0.001
      scheduler: cosine
      batch_size: 32
      epochs: 20
      loss: mae
      flips: true
      crop: [256, 256]
      mixed_precision: true
      random_state: 0
  cnn_efficientnet:
    type: cnn
    params: &efficientnet
      backbone: efficientnetb0
      pretrained: true
      optimizer: adamw
      learning_rate: 0.0003
      scheduler: cosine
      batch_size: 16
      epochs: 8
      loss: mae
      flips: true
      mixed_precision: true
      random_state: 0
  cnn_efficientnet_crop:
    type: cnn
    params:
      <<: *efficientnet
      batch_size: 32
      crop: [256, 256]

output:
  dir: outputs/cnn
