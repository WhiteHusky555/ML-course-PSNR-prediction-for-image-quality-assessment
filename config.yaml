data:
  dir: data
  train_file: train.csv
  test_file: sample_submission.csv
  id_column: img_name
  target: PSNR

features:
  table: features/features.csv.gz
  recompute: false
  images_dir: data

validation:
  n_splits: 5
  n_bins: 10
  seed: 42

models:
  median:
    type: dummy
    params:
      strategy: median
  linear:
    type: linear
    clip: [0.001, 0.999]
    scaler: standard
  ridge:
    type: ridge
    clip: [0.001, 0.999]
    scaler: standard
    grid:
      alpha: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  lasso:
    type: lasso
    clip: [0.001, 0.999]
    scaler: standard
    params:
      max_iter: 1000000
      precompute: true
    grid:
      alpha: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
  elasticnet:
    type: elasticnet
    clip: [0.001, 0.999]
    scaler: standard
    params:
      max_iter: 1000000
      precompute: true
    grid:
      alpha: [0.0001, 0.001, 0.01, 0.1]
      l1_ratio: [0.1, 0.5, 0.9]
  knn:
    type: knn
    clip: [0.001, 0.999]
    scaler: standard
    grid:
      n_neighbors: [3, 5, 10, 20, 50, 100]
      weights: [uniform, distance]
      metric: [euclidean, manhattan]
  tree:
    type: tree
    params:
      random_state: 0
    grid:
      max_depth: [3, 5, 10, 20, null]
      min_samples_leaf: [1, 5, 20, 100]
  forest:
    type: forest
    params:
      n_estimators: 300
      n_jobs: -1
      random_state: 0
    grid:
      max_features: [sqrt, 0.33, 0.5]
      min_samples_leaf: [1, 3, 10]
  gradboost:
    type: gradboost
    fold_jobs: -1
    params:
      n_estimators: 1000
      learning_rate: 0.05
      subsample: 0.8
      max_features: 0.7
      random_state: 0
    grid:
      loss: [squared_error, absolute_error, huber]
      max_depth: [3, 5]
  histgb:
    type: histgb
    params:
      max_iter: 2000
      learning_rate: 0.02
      max_features: 0.7
      early_stopping: false
      random_state: 0
    grid:
      loss: [squared_error, absolute_error]
      max_leaf_nodes: [15, 31, 63]
  lightgbm:
    type: lightgbm
    params:
      n_estimators: 2000
      learning_rate: 0.02
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.7
      random_state: 0
      n_jobs: -1
      verbose: -1
    grid:
      objective: [l2, l1, huber]
      num_leaves: [15, 31, 63]
  xgboost:
    type: xgboost
    center_target: true
    params:
      n_estimators: 2000
      learning_rate: 0.02
      subsample: 0.8
      colsample_bytree: 0.7
      tree_method: hist
      random_state: 0
      n_jobs: -1
    grid:
      objective: [reg:squarederror, reg:absoluteerror, reg:pseudohubererror]
      max_depth: [4, 6, 8]
  catboost:
    type: catboost
    center_target: true
    params:
      iterations: 2000
      learning_rate: 0.05
      random_seed: 0
      thread_count: -1
      verbose: 0
      allow_writing_files: false
    grid:
      loss_function: [RMSE, MAE, "Huber:delta=1.0"]
      depth: [4, 6, 8]

output:
  dir: outputs
