data:
  dir: data
  train_file: train.csv
  test_file: sample_submission.csv
  id_column: img_name
  target: PSNR

features:
  table: features/features.csv.gz
  recompute: false
  images_dir: data

validation:
  n_splits: 5
  n_bins: 10
  seed: 42

models:
  median:
    type: dummy
    params:
      strategy: median
  linear:
    type: linear
    scaler: standard
  ridge:
    type: ridge
    scaler: standard
    grid:
      alpha: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  lasso:
    type: lasso
    scaler: standard
    params:
      max_iter: 1000000
      precompute: true
    grid:
      alpha: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
  elasticnet:
    type: elasticnet
    scaler: standard
    params:
      max_iter: 1000000
      precompute: true
    grid:
      alpha: [0.0001, 0.001, 0.01, 0.1]
      l1_ratio: [0.1, 0.5, 0.9]

output:
  dir: outputs
