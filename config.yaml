data:
  dir: data
  train_file: train.csv
  test_file: sample_submission.csv
  id_column: img_name
  target: PSNR

features:
  table: features/features.csv.gz
  recompute: false
  images_dir: data

validation:
  n_splits: 5
  n_bins: 10
  seed: 42

models:
  median:
    type: dummy
    params:
      strategy: median
  linear:
    type: linear
    clip: [0.001, 0.999]
    scaler: standard
  ridge:
    type: ridge
    clip: [0.001, 0.999]
    scaler: standard
    grid:
      alpha: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  lasso:
    type: lasso
    clip: [0.001, 0.999]
    scaler: standard
    params:
      max_iter: 1000000
      precompute: true
    grid:
      alpha: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
  elasticnet:
    type: elasticnet
    clip: [0.001, 0.999]
    scaler: standard
    params:
      max_iter: 1000000
      precompute: true
    grid:
      alpha: [0.0001, 0.001, 0.01, 0.1]
      l1_ratio: [0.1, 0.5, 0.9]
  knn:
    type: knn
    clip: [0.001, 0.999]
    scaler: standard
    grid:
      n_neighbors: [3, 5, 10, 20, 50, 100]
      weights: [uniform, distance]
      metric: [euclidean, manhattan]
  tree:
    type: tree
    params:
      random_state: 0
    grid:
      max_depth: [3, 5, 10, 20, null]
      min_samples_leaf: [1, 5, 20, 100]
  forest:
    type: forest
    params:
      n_estimators: 300
      n_jobs: -1
      random_state: 0
    grid:
      max_features: [sqrt, 0.33, 0.5]
      min_samples_leaf: [1, 3, 10]

output:
  dir: outputs
